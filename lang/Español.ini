fhir_timeout_info = "Número máximo de segundos a esperar por cualquier servidor FHIR configurado antes de desistir. Sin un límite, un servidor de terminología lento o no disponible bloqueará los procesos del servidor web y puede dejar todo REDCap sin respuesta. Déjelo en blanco para usar el valor predeterminado de 10 segundos. Se aplica a cada categoría de ontología configurada más abajo."
return_all = "Devolver todos los valores sin importar el texto de búsqueda (navegar una lista corta sin necesidad de adivinar su redacción exacta)"
return_all_info = "Pensado solo para un ValueSet corto y completamente enumerado - obtiene la expansión completa en cada pulsación de tecla en lugar de un subconjunto filtrado, por lo que activarlo en un ValueSet grande sería lento y poco eficiente. Al marcarlo, la opción Devolver 'Sin resultados' de más abajo nunca llegará a activarse, siempre que haya al menos un valor configurado que no esté prohibido ni oculto (a diferencia de una búsqueda filtrada normal, esto siempre tiene algo que mostrar)."
